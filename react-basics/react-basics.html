    <script type="text/babel">
      const button = <button>hello</button>; // This is a html element

      const paragraph = <p>paragraph of text</p>;
      {
        /*
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(paragraph);
      */
      }

      {
        /*

      */
      }

      {

      //--- Use React to display multiple elements --- We can't save multiple elements in inside a variable but we can use <div> = Represent a container  -- purpose of <div> is contain other elements like button and paragraphs

      //Code cleanup --- separate the html and javascript for better understanding
      // this is js
      const div = (
        <div>
          <button>hello</button>
          <p>para {2 + 2} </p>

      ReactDOM.createRoot(container).render(div);
